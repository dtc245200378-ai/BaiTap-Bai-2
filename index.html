<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Nhúng CSS vào trang HTML</title>
    <!-- Phần 3: External-style -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Phần 2: Internal-style -->
    <style>
        .internal-style {
            color: green;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- Phần 1: Inline-style -->
    <h1 style="color: blue;">Tiêu đề sử dụng Inline CSS (Màu xanh dương)</h1>

    <!-- Phần 2: Internal-style -->
    <p class="internal-style">Đoạn văn sử dụng Internal CSS (Màu xanh lá)</p>

    <!-- Phần 3: External-style -->
    <p class="external-style">Đoạn văn sử dụng External CSS (Màu tím từ tệp style.css)</p>

</body>
</html>
