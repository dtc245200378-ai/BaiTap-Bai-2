<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Photo Gallery - Bootstrap Grid</title>
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #f8f9fa;
        }
        .gallery-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
            border-radius: 10px;
        }
        .gallery-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15) !important;
        }
        .gallery-img {
            height: 220px;
            object-fit: cover;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container my-5">
        <!-- Tiêu đề trang -->
        <div class="text-center mb-5">
            <h1 class="fw-bold text-primary">Bộ Sưu Tập Ảnh Responsive</h1>
            <p class="text-muted">Sử dụng Bootstrap Grid System: Mobile (1 cột) | Tablet (2 cột) | Desktop (4 cột)</p>
        </div>

        <!-- Hàng chứa danh sách ảnh -->
        <div class="row g-4">
            <!-- Ảnh 1 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card border-0 shadow-sm h-100 gallery-card">
                    <img src="https://picsum.photos/id/1015/600/400" class="card-img-top gallery-img" alt="Thiên nhiên 1">
                    <div class="card-body text-center">
                        <h5 class="card-title fs-6 fw-semibold text-dark mb-0">Phong cảnh Hồ núi</h5>
                    </div>
                </div>
            </div>

            <!-- Ảnh 2 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card border-0 shadow-sm h-100 gallery-card">
                    <img src="https://picsum.photos/id/1018/600/400" class="card-img-top gallery-img" alt="Thiên nhiên 2">
                    <div class="card-body text-center">
                        <h5 class="card-title fs-6 fw-semibold text-dark mb-0">Dãy núi Hùng vĩ</h5>
                    </div>
                </div>
            </div>

            <!-- Ảnh 3 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card border-0 shadow-sm h-100 gallery-card">
                    <img src="https://picsum.photos/id/1025/600/400" class="card-img-top gallery-img" alt="Thiên nhiên 3">
                    <div class="card-body text-center">
                        <h5 class="card-title fs-6 fw-semibold text-dark mb-0">Động vật Hoang dã</h5>
                    </div>
                </div>
            </div>

            <!-- Ảnh 4 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card border-0 shadow-sm h-100 gallery-card">
                    <img src="https://picsum.photos/id/1039/600/400" class="card-img-top gallery-img" alt="Thiên nhiên 4">
                    <div class="card-body text-center">
                        <h5 class="card-title fs-6 fw-semibold text-dark mb-0">Thác nước Rừng xanh</h5>
                    </div>
                </div>
            </div>

            <!-- Ảnh 5 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card border-0 shadow-sm h-100 gallery-card">
                    <img src="https://picsum.photos/id/1043/600/400" class="card-img-top gallery-img" alt="Thiên nhiên 5">
                    <div class="card-body text-center">
                        <h5 class="card-title fs-6 fw-semibold text-dark mb-0">Bờ biển Hoàng hôn</h5>
                    </div>
                </div>
            </div>

            <!-- Ảnh 6 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card border-0 shadow-sm h-100 gallery-card">
                    <img src="https://picsum.photos/id/1050/600/400" class="card-img-top gallery-img" alt="Thiên nhiên 6">
                    <div class="card-body text-center">
                        <h5 class="card-title fs-6 fw-semibold text-dark mb-0">Thành phố Cổ kính</h5>
                    </div>
                </div>
            </div>

            <!-- Ảnh 7 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card border-0 shadow-sm h-100 gallery-card">
                    <img src="https://picsum.photos/id/1069/600/400" class="card-img-top gallery-img" alt="Thiên nhiên 7">
                    <div class="card-body text-center">
                        <h5 class="card-title fs-6 fw-semibold text-dark mb-0">Con đường Mùa thu</h5>
                    </div>
                </div>
            </div>

            <!-- Ảnh 8 -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card border-0 shadow-sm h-100 gallery-card">
                    <img src="https://picsum.photos/id/1084/600/400" class="card-img-top gallery-img" alt="Thiên nhiên 8">
                    <div class="card-body text-center">
                        <h5 class="card-title fs-6 fw-semibold text-dark mb-0">Biển mây Đỉnh núi</h5>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
